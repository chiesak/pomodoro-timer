<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pomodoro-for-writers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root { --bg: #0b0e14; --surface: #161b22; --accent: #e05a5a; --text-main: #f0f6fc; --text-sub: #8b949e; --border: #30363d; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); height: 100vh; overflow: hidden; position: fixed; width: 100%; }
header { padding: 30px 20px 10px; display: flex; justify-content: space-between; align-items: flex-end; }
h1 { font-size: 1.1rem; font-weight: 300; letter-spacing: 0.1em; }
.total-label { font-size: 0.6rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.1em; }
.total-count { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; color: var(--accent); }
#content { height: calc(100% - 170px); overflow-y: auto; padding: 20px; }
.view { display: none; opacity: 0; }
.view.active { display: block; opacity: 1; }
.timer-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 40px 20px; text-align: center; margin-bottom: 20px; transition: background 0.3s; }
.mode-status { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-sub); margin-bottom: 10px; }
.timer-display { font-family: 'JetBrains Mono', monospace; font-size: 4.2rem; font-weight: 500; margin: 10px 0 30px; }
.controls { display: flex; justify-content: center; align-items: center; gap: 25px; }
.btn { background: none; border: none; color: var(--text-sub); font-size: 0.7rem; letter-spacing: 0.1em; cursor: pointer; padding: 10px; }
.btn-play { background: var(--accent); color: white; width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; box-shadow: 0 4px 15px rgba(224,90,90,0.3); }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; text-align: center; }
.stat-val { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; display: block; }
.stat-lbl { font-size: 0.6rem; color: var(--text-sub); text-transform: uppercase; margin-top: 5px; }
nav { position: fixed; bottom: 0; width: 100%; height: 85px; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
nav button { background: none; border: none; color: var(--text-sub); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; width: 50%; cursor: pointer; }
nav button.active { color: var(--accent); font-weight: 600; }
.flash-red { animation: flash 0.5s infinite; }
@keyframes flash { 0% { background: var(--surface); } 50% { background: #4a1515; } 100% { background: var(--surface); } }
</style>
</head>
<body>

<header>
  <h1>Pomodoro-for-writers</h1>
  <div style="text-align: right;">
    <div class="total-label">Total Chars</div>
    <div class="total-count" id="total-chars">0</div>
  </div>
</header>

<div id="content">
  <div id="view-timer" class="view active">
    <div class="timer-card" id="timer-card">
      <div class="mode-status" id="mode-text">Focus</div>
      <div class="timer-display" id="timer-display">20:00</div>
      <div class="controls">
        <button class="btn" onclick="resetTimer()">RESET</button>
        <button class="btn btn-play" id="btn-play" onclick="handlePlay()">▶</button>
        <button class="btn" onclick="skipSession()">SKIP</button>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><span class="stat-val" id="today-sessions">0</span><span class="stat-lbl">Sessions</span></div>
      <div class="stat-card"><span class="stat-val" id="today-chars">0</span><span class="stat-lbl">Today's Chars</span></div>
    </div>
  </div>

  <div id="view-settings" class="view">
    <div style="background:var(--surface); border-radius:15px; border:1px solid var(--border); overflow:hidden;">
      <div style="display:flex; justify-content:space-between; padding:20px; border-bottom:1px solid var(--border);">
        <span>Focus (min)</span><input type="number" pattern="\d*" style="background:#000; border:1px solid var(--border); color:var(--accent); width:80px; text-align:center; border-radius:8px;" id="set-focus" oninput="saveSettings()">
      </div>
      <div style="display:flex; justify-content:space-between; padding:20px;">
        <span>Break (min)</span><input type="number" pattern="\d*" style="background:#000; border:1px solid var(--border); color:var(--accent); width:80px; text-align:center; border-radius:8px;" id="set-break" oninput="saveSettings()">
      </div>
    </div>
  </div>
</div>

<nav>
  <button id="nav-timer" class="active" onclick="switchView('timer')">Timer</button>
  <button id="nav-settings" onclick="switchView('settings')">Settings</button>
</nav>

<script>
// バージョンを更新して古いキャッシュ干渉を防ぐ
let data = JSON.parse(localStorage.getItem('pomowriters_v9') || '{"settings":{"focus":20,"break":5},"days":{}}');
let state = { running: false, mode: 'focus', timeLeft: data.settings.focus * 60, timerId: null, startCount: 0 };

function todayKey() { return new Date().toISOString().split('T')[0]; }

// UIと累計計算の同期を確実にする関数
function updateUI() {
  const m = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
  const s = (state.timeLeft % 60).toString().padStart(2, '0');
  document.getElementById('timer-display').textContent = `${m}:${s}`;
  
  const tk = todayKey();
  const day = data.days[tk] || { sessions: 0, chars: 0 };
  
  document.getElementById('today-sessions').textContent = day.sessions;
  document.getElementById('today-chars').textContent = day.chars.toLocaleString();
  
  // すべての日の合計を再計算して確実に反映
  let totalAcrossAllDays = 0;
  for (let key in data.days) {
    totalAcrossAllDays += (data.days[key].chars || 0);
  }
  document.getElementById('total-chars').textContent = totalAcrossAllDays.toLocaleString();
}

function handlePlay() {
  if (state.running) {
    toggleTimer();
  } else {
    if (state.mode === 'focus') {
      const val = prompt("Writing Start - Current character count:", "");
      if (val === null) return;
      state.startCount = (val === "") ? state.startCount : (parseInt(val) || 0);
    }
    toggleTimer();
  }
}

function toggleTimer() {
  if (state.running) {
    state.running = false;
    clearInterval(state.timerId);
    document.getElementById('btn-play').textContent = "▶";
  } else {
    state.running = true;
    state.endTime = Date.now() + (state.timeLeft * 1000);
    state.timerId = setInterval(tick, 200);
    document.getElementById('btn-play').textContent = "⏸";
  }
}

function tick() {
  const diff = Math.round((state.endTime - Date.now()) / 1000);
  if (diff <= 0) {
    state.timeLeft = 0;
    complete();
  } else {
    state.timeLeft = diff;
    updateUI();
  }
}

function complete() {
  state.running = false;
  clearInterval(state.timerId);
  document.getElementById('timer-card').classList.add('flash-red');

  setTimeout(() => {
    let charDiff = 0;
    if (state.mode === 'focus') {
      const e = prompt("Time up! Writing End - Current character count:", "");
      const endCount = (e === null || e === "") ? state.startCount : (parseInt(e) || state.startCount);
      charDiff = Math.max(0, endCount - state.startCount);
      state.startCount = endCount; 
    } else {
      alert("Break finished.");
    }

    const tk = todayKey();
    if (!data.days[tk]) data.days[tk] = { sessions: 0, chars: 0 };
    
    // セッションごとに文字数を加算
    if (state.mode === 'focus') {
      data.days[tk].sessions += 1;
      data.days[tk].chars += charDiff;
    }

    // 保存
    localStorage.setItem('pomowriters_v9', JSON.stringify(data));
    
    // モード切り替え
    state.mode = (state.mode === 'focus') ? 'break' : 'focus';
    state.timeLeft = (state.mode === 'focus' ? data.settings.focus : data.settings.break) * 60;
    document.getElementById('mode-text').textContent = state.mode.toUpperCase();
    document.getElementById('btn-play').textContent = "▶";
    document.getElementById('timer-card').classList.remove('flash-red');
    updateUI();
  }, 500);
}

function switchView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'settings') {
    document.getElementById('set-focus').value = data.settings.focus;
    document.getElementById('set-break').value = data.settings.break;
  }
}

function saveSettings() {
  const f = parseInt(document.getElementById('set-focus').value);
  const b = parseInt(document.getElementById('set-break').value);
  if (f > 0) data.settings.focus = f;
  if (b > 0) data.settings.break = b;
  localStorage.setItem('pomowriters_v9', JSON.stringify(data));
  if (!state.running) resetTimer();
}

function resetTimer() {
  state.running = false;
  clearInterval(state.timerId);
  state.timeLeft = (state.mode === 'focus' ? data.settings.focus : data.settings.break) * 60;
  document.getElementById('btn-play').textContent = "▶";
  updateUI();
}

function skipSession() { if(confirm("Skip?")) complete(); }
updateUI();
</script>
</body>
</html>
