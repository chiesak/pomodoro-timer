<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pomodoro-for-writers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0e14;
  --surface: #161b22;
  --accent: #e05a5a;
  --text-main: #f0f6fc;
  --text-sub: #8b949e;
  --border: #30363d;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); height: 100vh; overflow: hidden; }

header { padding: 30px 20px 10px; display: flex; justify-content: space-between; align-items: flex-end; }
h1 { font-size: 1.2rem; font-weight: 300; letter-spacing: 0.1em; color: var(--text-main); }
.total-label { font-size: 0.6rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.1em; }
.total-count { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; color: var(--accent); }

#content { height: calc(100% - 160px); overflow-y: auto; padding: 20px; }

/* Timer Style */
.timer-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 40px 20px; text-align: center; margin-bottom: 20px; }
.mode-status { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-sub); margin-bottom: 10px; }
.timer-display { font-family: 'JetBrains Mono', monospace; font-size: 4.5rem; font-weight: 500; margin: 10px 0 30px; color: var(--text-main); }

.controls { display: flex; justify-content: center; align-items: center; gap: 25px; }
.btn { background: none; border: none; cursor: pointer; color: var(--text-sub); transition: 0.2s; }
.btn-play { background: var(--accent); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 4px 15px rgba(224, 90, 90, 0.3); }
.btn-play:active { transform: scale(0.95); }

/* Stats & History */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; text-align: center; }
.stat-val { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; display: block; }
.stat-lbl { font-size: 0.6rem; color: var(--text-sub); text-transform: uppercase; margin-top: 5px; }

.history-section { border-top: 1px solid var(--border); padding-top: 20px; }
.history-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(48, 54, 61, 0.5); font-size: 0.8rem; }
.hist-time { color: var(--text-sub); font-family: 'JetBrains Mono', monospace; }

/* Settings View */
.settings-view { display: none; padding: 20px; }
.setting-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border); }
.input-num { background: var(--bg); border: 1px solid var(--border); color: var(--accent); font-family: 'JetBrains Mono', monospace; width: 60px; text-align: center; padding: 5px; border-radius: 4px; }

nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding-bottom: 15px; }
nav button { background: none; border: none; color: var(--text-sub); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; padding-top: 10px; cursor: pointer; }
nav button.active { color: var(--accent); font-weight: 600; }

.flash-red { animation: flash 0.5s infinite; }
@keyframes flash { 0% { background: var(--bg); } 50% { background: #401010; } 100% { background: var(--bg); } }
</style>
</head>
<body>

<header>
  <div>
    <h1>Pomodoro-for-writers</h1>
    <span id="wakelock-indicator" style="font-size:0.5rem; color:var(--accent);"></span>
  </div>
  <div style="text-align: right;">
    <div class="total-label">Total Characters</div>
    <div class="total-count" id="total-chars">0</div>
  </div>
</header>

<div id="content">
  <div id="view-timer">
    <div class="timer-card" id="timer-card">
      <div class="mode-status" id="mode-text">Focus</div>
      <div class="timer-display" id="timer-display">20:00</div>
      <div class="controls">
        <button class="btn" onclick="resetTimer()">RESET</button>
        <button class="btn btn-play" id="btn-play" onclick="toggleTimer()">▶</button>
        <button class="btn" onclick="skipSession()">SKIP</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-val" id="today-sessions">0</span>
        <span class="stat-lbl">Sessions</span>
      </div>
      <div class="stat-card">
        <span class="stat-val" id="today-chars">0</span>
        <span class="stat-lbl">Today's Chars</span>
      </div>
    </div>

    <div class="history-section">
      <div class="total-label" style="margin-bottom:10px;">Log</div>
      <div id="history-list"></div>
    </div>
  </div>

  <div id="view-settings" class="settings-view">
    <div class="total-label" style="margin-bottom:20px;">Timer Settings (min)</div>
    <div class="setting-row">
      <span>Focus Duration</span>
      <input type="number" class="input-num" id="set-focus" value="20" onchange="updateSettings()">
    </div>
    <div class="setting-row">
      <span>Break Duration</span>
      <input type="number" class="input-num" id="set-break" value="5" onchange="updateSettings()">
    </div>
    <div style="margin-top: 40px;">
      <button onclick="clearData()" style="color:var(--accent); background:none; border:none; font-size:0.7rem; text-decoration:underline; cursor:pointer;">CLEAR ALL DATA</button>
    </div>
  </div>
</div>

<nav>
  <button id="nav-timer" class="active" onclick="switchView('timer')">Timer</button>
  <button id="nav-settings" onclick="switchView('settings')">Settings</button>
</nav>

<script>
let data = JSON.parse(localStorage.getItem('pomodoro_writers_v3') || '{"settings":{"focus":20,"break":5},"days":{}}');
let state = { running: false, mode: 'focus', timeLeft: data.settings.focus * 60, timerId: null, audioCtx: null };
let wakeLock = null;

function todayKey() { return new Date().toISOString().split('T')[0]; }

// ユーザーがボタンを押した時にAudioContextを初期化
function initAudio() {
  if (!state.audioCtx) {
    state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function updateUI() {
  const m = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
  const s = (state.timeLeft % 60).toString().padStart(2, '0');
  document.getElementById('timer-display').textContent = `${m}:${s}`;
  
  const tk = todayKey();
  const day = data.days[tk] || { sessions: 0, chars: 0, history: [] };
  document.getElementById('today-sessions').textContent = day.sessions;
  document.getElementById('today-chars').textContent = day.chars;
  
  let total = 0;
  Object.values(data.days).forEach(d => total += (d.chars || 0));
  document.getElementById('total-chars').textContent = total.toLocaleString();

  document.getElementById('history-list').innerHTML = day.history.slice().reverse().map(h => `
    <div class="history-item">
      <span>${h.mode.toUpperCase()}</span>
      <span class="hist-time">${h.info} @ ${h.time}</span>
    </div>
  `).join('');
}

async function toggleTimer() {
  initAudio();
  if (state.running) {
    state.running = false;
    clearInterval(state.timerId);
    document.getElementById('btn-play').textContent = "▶";
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
  } else {
    state.running = true;
    state.endTime = Date.now() + (state.timeLeft * 1000);
    state.timer
