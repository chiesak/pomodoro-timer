<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0f1117">
<title>Pomodoro for writers</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --surface: #181c27;
  --surface2: #1f2436;
  --border: #2a3050;
  --text: #e8eaf0;
  --muted: #5a6080;
  --focus-color: #e05a5a;
  --break-color: #4ab89a;
  --accent: #f0a04a;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; height: -webkit-fill-available; font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
#app { display: flex; flex-direction: column; height: 100%; height: -webkit-fill-available; }

header { padding: calc(var(--safe-top) + 14px) 20px 12px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
header h1 { font-size: 1rem; font-weight: 500; letter-spacing: 0.08em; }
header p { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em; }
.header-stats { display: flex; gap: 16px; align-items: center; }
.hstat { text-align: right; }
.hstat-val { font-family: 'DM Mono', monospace; font-size: 0.95rem; color: var(--accent); }
.hstat-lbl { font-size: 0.58rem; color: var(--muted); }

#content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 0 calc(var(--safe-bottom) + 70px); }

.timer-section { padding: 28px 20px 20px; display: flex; flex-direction: column; align-items: center; }
.mode-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 20px; font-size: 0.72rem; font-weight: 500; letter-spacing: 0.08em; margin-bottom: 24px; transition: all 0.4s; }
.mode-badge.focus { background: rgba(224,90,90,0.15); color: var(--focus-color); border: 1px solid rgba(224,90,90,0.3); }
.mode-badge.break { background: rgba(74,184,154,0.15); color: var(--break-color); border: 1px solid rgba(74,184,154,0.3); }
.mode-dot { width: 6px; height: 6px; border-radius: 50%; }
.focus .mode-dot { background: var(--focus-color); box-shadow: 0 0 6px var(--focus-color); }
.break .mode-dot { background: var(--break-color); box-shadow: 0 0 6px var(--break-color); }

.ring-wrap { position: relative; width: 220px; height: 220px; margin-bottom: 28px; }
.ring-wrap svg { transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--surface2); stroke-width: 10; }
.ring-progress { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke 0.4s; }
.ring-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
.timer-display { font-family: 'DM Mono', monospace; font-size: 3.2rem; font-weight: 500; line-height: 1; letter-spacing: 0.02em; transition: color 0.4s; }
.timer-session { font-size: 0.7rem; color: var(--muted); margin-top: 6px; letter-spacing: 0.1em; }

.controls { display: flex; gap: 14px; align-items: center; margin-bottom: 24px; }
.btn-main { width: 68px; height: 68px; border-radius: 50%; border: none; cursor: pointer; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; transition: transform 0.15s, box-shadow 0.15s; -webkit-appearance: none; }
.btn-main:active { transform: scale(0.93); }
.btn-main.focus-btn { background: var(--focus-color); box-shadow: 0 0 20px rgba(224,90,90,0.35); }
.btn-main.break-btn { background: var(--break-color); box-shadow: 0 0 20px rgba(74,184,154,0.35); }
.btn-main.paused { background: var(--surface2); border: 1px solid var(--border); box-shadow: none; }
.btn-sub { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; -webkit-appearance: none; }

.session-dots { display: flex; gap: 8px; margin-bottom: 8px; }
.sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); transition: all 0.3s; }
.sdot.done { background: var(--focus-color); border-color: var(--focus-color); }
.sdot.active { border-color: var(--focus-color); animation: pulse-dot 1.2s infinite; }
@keyframes pulse-dot { 0%, 100% { box-shadow: 0 0 0 0 rgba(224,90,90,0.5); } 50% { box-shadow: 0 0 0 4px rgba(224,90,90,0); } }

.stats-section, .history-section, .settings-section { margin: 0 16px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
.stats-title, .history-title, .settings-title { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.stat-item { text-align: center; }
.stat-num { font-family: 'DM Mono', monospace; font-size: 1.4rem; color: var(--text); }
.stat-num.focus-col { color: var(--focus-color); }
.stat-label { font-size: 0.6rem; color: var(--muted); }

.history-list { max-height: 250px; overflow-y: auto; }
.history-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.78rem; }
.h-badge { width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.h-badge.focus { background: var(--focus-color); }
.h-badge.break { background: var(--break-color); }
.h-info { flex: 1; }
.h-top { display: flex; justify-content: space-between; margin-bottom: 2px; }
.h-time { color: var(--muted); font-family: 'DM Mono', monospace; }
.h-note { color: var(--accent); font-size: 0.72rem; font-style: italic; margin-top: 2px; }

.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
.stepper { display: flex; align-items: center; gap: 10px; }
.step-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; }
.step-val { font-family: 'DM Mono', monospace; min-width: 40px; text-align: center; color: var(--accent); }

nav { display: flex; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: var(--safe-bottom); position: fixed; bottom: 0; width: 100%; }
nav button { flex: 1; padding: 12px 0; background: none; border: none; color: var(--muted); font-size: 0.65rem; display: flex; flex-direction: column; align-items: center; gap: 4px; }
nav button.active { color: var(--focus-color); }

.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 30px; }
.overlay.show { display: flex; }
.overlay-icon { font-size: 3rem; margin-bottom: 16px; }
.overlay-btn { padding: 14px 40px; border-radius: 30px; border: none; font-weight: 500; cursor: pointer; margin-top: 20px; }
.overlay-btn.focus-next { background: var(--focus-color); color: white; }
.overlay-btn.break-next { background: var(--break-color); color: white; }

/* Wake Lock 状態表示 */
.wakelock-status { font-size: 0.55rem; color: var(--break-color); opacity: 0.7; margin-top: 4px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Pomodoro-for-writers</h1>
      <p>Academic Focus Timer</p>
      <div id="wakelock-msg" class="wakelock-status"></div>
    </div>
    <div class="header-stats">
      <div class="hstat">
        <div class="hstat-val" id="h-total-chars">0</div>
        <div class="hstat-lbl">累計執筆文字数</div>
      </div>
    </div>
  </header>

  <div id="content">
    <div id="page-timer" class="page active">
      <div class="timer-section">
        <div class="mode-badge focus" id="mode-badge">
          <span class="mode-dot"></span>
          <span id="mode-label">集中</span>
        </div>

        <div class="ring-wrap">
          <svg width="220" height="220" viewBox="0 0 220 220">
            <circle class="ring-track" cx="110" cy="110" r="100"/>
            <circle class="ring-progress" id="ring-progress" cx="110" cy="110" r="100" stroke-dasharray="628.3" stroke-dashoffset="0" stroke="var(--focus-color)"/>
          </svg>
          <div class="ring-center">
            <div class="timer-display" id="timer-display">25:00</div>
            <div class="timer-session" id="timer-session">セッション 1 / 4</div>
          </div>
        </div>

        <div class="session-dots" id="session-dots"></div>

        <div class="controls">
          <button class="btn-sub" onclick="resetTimer()">↺</button>
          <button class="btn-main focus-btn paused" id="btn-play" onclick="toggleTimer()">▶</button>
          <button class="btn-sub" onclick="skipSession()">⏭</button>
        </div>
      </div>

      <div class="stats-section">
        <div class="stats-title">本日の進捗</div>
        <div class="stats-row">
          <div class="stat-item"><div class="stat-num focus-col" id="stat-focus-sessions">0</div><div class="stat-label">セッション</div></div>
          <div class="stat-item"><div class="stat-num" style="color:var(--accent)" id="stat-today-chars">0</div><div class="stat-label">執筆文字数</div></div>
          <div class="stat-item"><div class="stat-num" style="color:var(--break-color)" id="stat-streak">0</div><div class="stat-label">継続日数</div></div>
        </div>
      </div>

      <div class="history-section">
        <div class="history-title">履歴とメモ</div>
        <div class="history-list" id="history-list"></div>
      </div>
    </div>

    <div id="page-settings" class="page" style="display:none; padding-bottom:100px;">
        <div class="settings-section">
            <div class="settings-title">タイマー設定</div>
            <div class="setting-row">
                <span>集中時間</span>
                <div class="stepper">
                    <button class="step-btn" onclick="adjustSetting('focus', -5)">-</button>
                    <div class="step-val" id="set-focus">25分</div>
                    <button class="step-btn" onclick="adjustSetting('focus', 5)">+</button>
                </div>
            </div>
            <div class="setting-row">
                <span>短い休憩</span>
                <div class="stepper">
                    <button class="step-btn" onclick="adjustSetting('shortBreak', -1)">-</button>
                    <div class="step-val" id="set-short">5分</div>
                    <button class="step-btn" onclick="adjustSetting('shortBreak', 1)">+</button>
                </div>
            </div>
            <div class="setting-row">
                <span>長い休憩</span>
                <div class="stepper">
                    <button class="step-btn" onclick="adjustSetting('longBreak', -5)">-</button>
                    <div class="step-val" id="set-long">20分</div>
                    <button class="step-btn" onclick="adjustSetting('longBreak', 5)">+</button>
                </div>
            </div>
        </div>
        <div style="text-align:center; padding: 20px;">
            <button onclick="resetToday()" style="color:var(--focus-color); background:none; border:1px solid var(--focus-color); padding:8px 16px; border-radius:5px;">今日のデータをリセット</button>
        </div>
    </div>
  </div>

  <nav>
    <button class="active" onclick="showPage('timer', this)"><span>⏱</span>タイマー</button>
    <button onclick="showPage('settings', this)"><span>⚙️</span>設定</button>
  </nav>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-icon" id="overlay-icon">🎯</div>
  <div class="overlay-title" id="overlay-title">完了！</div>
  <div class="overlay-sub" id="overlay-sub"></div>
  <button class="overlay-btn focus-next" id="overlay-btn" onclick="startNext()">次へ</button>
</div>

<script>
const DEFAULT_SETTINGS = { focus: 25, shortBreak: 5, longBreak: 20, sessionsPerSet: 4 };
let wakeLock = null;

function getData() {
  try { return JSON.parse(localStorage.getItem('pomowrite_pro_v1') || 'null') || { settings: {...DEFAULT_SETTINGS}, days: {} }; }
  catch(e) { return { settings: {...DEFAULT_SETTINGS}, days: {} }; }
}
function saveData(d) { localStorage.setItem('pomowrite_pro_v1', JSON.stringify(d)); }
function today() { return new Date().toISOString().split('T')[0]; }

let data = getData();
let settings = data.settings;
let state = {
  mode: 'focus',
  running: false,
  sessionInSet: 1,
  remaining: settings.focus * 60,
  total: settings.focus * 60,
  intervalId: null
};

// --- Wake Lock API (画面消灯防止) ---
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      document.getElementById('wakelock-msg').textContent = '✔ Screen Active (スリープ防止中)';
    } catch (err) {
      console.error(`${err.name}, ${err.message}`);
    }
  }
}

function releaseWakeLock() {
  if (wakeLock !== null) {
    wakeLock.release();
    wakeLock = null;
    document.getElementById('wakelock-msg').textContent = '';
  }
}

// --- タイマー制御 ---
function toggleTimer() {
  if (state.running) {
    clearInterval(state.intervalId);
    state.running = false;
    releaseWakeLock();
  } else {
    state.running = true;
    state.intervalId = setInterval(tick, 1000);
    requestWakeLock();
  }
  updateDisplay();
}

function tick() {
  if (state.remaining <= 0) {
    completeSession();
    return;
  }
  state.remaining--;
  if (state.remaining % 60 === 0) updateDisplay(); // 1分ごとに更新
  else document.getElementById('timer-display').textContent = formatTime(state.remaining);
  
  // リングの更新
  const circ = 2 * Math.PI * 100;
  document.getElementById('ring-progress').style.strokeDashoffset = circ * (1 - state.remaining / state.total);
}

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function completeSession() {
  clearInterval(state.intervalId);
  state.running = false;
  releaseWakeLock();

  let note = "";
  let chars = 0;
  
  if (state.mode === 'focus') {
    const input = prompt("【セッション完了】お疲れ様です！\n今回の執筆文字数、または進捗メモを入力してください：", "");
    if (input !== null) {
      note = input;
      const matched = input.match(/\d+/);
      chars = matched ? parseInt(matched[0]) : 0;
    }
  }

  // 保存処理
  const t = today();
  if (!data.days[t]) data.days[t] = { sessions: [], focusCount: 0, charCount: 0 };
  
  const now = new Date();
  data.days[t].sessions.push({
    type: state.mode,
    time: now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0'),
    minutes: Math.round(state.total / 60),
    note: note,
    chars: chars
  });
  
  if (state.mode === 'focus') {
    data.days[t].focusCount++;
    data.days[t].charCount += chars;
  }
  saveData(data);
  showOverlay(note);
}

function showOverlay(note) {
  const ov = document.getElementById('overlay');
  const title = document.getElementById('overlay-title');
  const sub = document.getElementById('overlay-sub');
  
  if (state.mode === 'focus') {
    title.textContent = "集中セッション完了";
    sub.innerHTML = note ? `進捗: ${note}<br>一息ついてリフレッシュ！` : "お疲れ様でした！";
  } else {
    title.textContent = "休憩終了";
    sub.textContent = "休んだらもっと書きたくなった？";
  }
  ov.classList.add('show');
}

function startNext() {
  document.getElementById('overlay').classList.remove('show');
  if (state.mode === 'focus') {
    const isLong = state.sessionInSet >= settings.sessionsPerSet;
    state.mode = isLong ? 'longBreak' : 'shortBreak';
    state.remaining = (isLong ? settings.longBreak : settings.shortBreak) * 60;
  } else {
    if (state.mode === 'longBreak') state.sessionInSet = 1;
    else state.sessionInSet++;
    state.mode = 'focus';
    state.remaining = settings.focus * 60;
  }
  state.total = state.remaining;
  updateDisplay();
  toggleTimer();
}

// --- UI更新 ---
function updateDisplay() {
  document.getElementById('timer-display').textContent = formatTime(state.remaining);
  document.getElementById('mode-label').textContent = state.mode === 'focus' ? '集中' : '休憩';
  document.getElementById('mode-badge').className = 'mode-badge ' + (state.mode === 'focus' ? 'focus' : 'break');
  document.getElementById('btn-play').textContent = state.running ? '⏸' : '▶';
  document.getElementById('btn-play').className = 'btn-main ' + (state.mode === 'focus' ? 'focus-btn' : 'break-btn') + (state.running ? '' : ' paused');
  
  const t = today();
  const dayData = data.days[t] || { focusCount: 0, charCount: 0, sessions: [] };
  document.getElementById('stat-focus-sessions').textContent = dayData.focusCount;
  document.getElementById('stat-today-chars').textContent = dayData.charCount;
  
  // 累計文字数計算
  let totalChars = 0;
  Object.values(data.days).forEach(d => totalChars += (d.charCount || 0));
  document.getElementById('h-total-chars').textContent = totalChars.toLocaleString();

  renderHistory(dayData.sessions);
  updateDots();
}

function renderHistory(sessions) {
  const list = document.getElementById('history-list');
  if (!sessions || sessions.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:var(--muted); padding:20px;">今日の記録はまだありません</p>';
    return;
  }
  list.innerHTML = sessions.slice().reverse().map(s => `
    <div class="history-item">
      <div class="h-badge ${s.type}"></div>
      <div class="h-info">
        <div class="h-top">
          <span>${s.type === 'focus' ? '🎯 集中' : '☕ 休憩'} (${s.minutes}分)</span>
          <span class="h-time">${s.time}</span>
        </div>
        ${s.note ? `<div class="h-note">📝 ${s.note}</div>` : ''}
      </div>
    </div>
  `).join('');
}

function updateDots() {
  const el = document.getElementById('session-dots');
  el.innerHTML = '';
  for (let i = 1; i <= settings.sessionsPerSet; i++) {
    const d = document.createElement('div');
    d.className = 'sdot' + (i < state.sessionInSet ? ' done' : i === state.sessionInSet && state.mode === 'focus' ? ' active' : '');
    el.appendChild(d);
  }
}

// --- その他設定 ---
function showPage(page, btn) {
    document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
    document.getElementById('page-' + page).style.display = 'block';
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

function adjustSetting(key, delta) {
    settings[key] = Math.max(1, settings[key] + delta);
    data.settings = settings;
    saveData(data);
    document.getElementById('set-focus').textContent = settings.focus + '分';
    document.getElementById('set-short').textContent = settings.shortBreak + '分';
    document.getElementById('set-long').textContent = settings.longBreak + '分';
    if (!state.running) resetTimer();
}

function resetTimer() {
    clearInterval(state.intervalId);
    state.running = false;
    state.remaining = (state.mode === 'focus' ? settings.focus : (state.mode === 'shortBreak' ? settings.shortBreak : settings.longBreak)) * 60;
    state.total = state.remaining;
    updateDisplay();
}

function skipSession() {
    if(confirm("現在のセッションをスキップしますか？")) completeSession();
}

function resetToday() {
    if(confirm("今日の記録を消去しますか？")) {
        data.days[today()] = { sessions: [], focusCount: 0, charCount: 0 };
        saveData(data);
        updateDisplay();
    }
}

// 初期化
updateDisplay();
</script>
</body>
</html>
