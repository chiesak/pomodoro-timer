<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pomodoro-for-writers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0e14;
  --surface: #161b22;
  --accent: #e05a5a;
  --text-main: #f0f6fc;
  --text-sub: #8b949e;
  --border: #30363d;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); height: 100vh; overflow: hidden; }

header { padding: 30px 20px 10px; display: flex; justify-content: space-between; align-items: flex-end; }
h1 { font-size: 1.1rem; font-weight: 300; letter-spacing: 0.1em; color: var(--text-main); }
.total-label { font-size: 0.6rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.1em; }
.total-count { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; color: var(--accent); }

#content { height: calc(100% - 160px); overflow-y: auto; padding: 20px; }

/* Views */
.view { display: none; }
.view.active { display: block; }

/* Timer Style */
.timer-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 40px 20px; text-align: center; margin-bottom: 20px; position: relative; }
.mode-status { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-sub); margin-bottom: 10px; }
.timer-display { font-family: 'JetBrains Mono', monospace; font-size: 4.5rem; font-weight: 500; margin: 10px 0 30px; color: var(--text-main); }

.controls { display: flex; justify-content: center; align-items: center; gap: 25px; }
.btn { background: none; border: none; cursor: pointer; color: var(--text-sub); font-size: 0.7rem; letter-spacing: 0.1em; }
.btn-play { background: var(--accent); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 4px 15px rgba(224, 90, 90, 0.3); }

/* Stats */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; text-align: center; }
.stat-val { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; display: block; }
.stat-lbl { font-size: 0.6rem; color: var(--text-sub); text-transform: uppercase; margin-top: 5px; }

/* Settings View Styles */
.settings-view h2 { font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; margin-bottom: 20px; letter-spacing: 0.1em; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
.setting-row { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border); }
.setting-info span { display: block; font-size: 0.9rem; }
.setting-info small { color: var(--text-sub); font-size: 0.7rem; }
.input-num { background: #000; border: 1px solid var(--border); color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; width: 70px; text-align: center; padding: 8px; border-radius: 8px; outline: none; }

nav { position: fixed; bottom: 0; width: 100%; height: 80px; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding-bottom: 20px; z-index: 100; }
nav button { background: none; border: none; color: var(--text-sub); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; width: 50%; cursor: pointer; }
nav button.active { color: var(--accent); font-weight: 600; }

.flash-red { animation: flash 0.5s infinite; }
@keyframes flash { 0% { background: var(--surface); } 50% { background: #401010; } 100% { background: var(--surface); } }
</style>
</head>
<body>

<header>
  <div>
    <h1>Pomodoro-for-writers</h1>
  </div>
  <div style="text-align: right;">
    <div class="total-label">Total Chars</div>
    <div class="total-count" id="total-chars">0</div>
  </div>
</header>

<div id="content">
  <div id="view-timer" class="view active">
    <div class="timer-card" id="timer-card">
      <div class="mode-status" id="mode-text">Focus</div>
      <div class="timer-display" id="timer-display">20:00</div>
      <div class="controls">
        <button class="btn" onclick="resetTimer()">RESET</button>
        <button class="btn btn-play" id="btn-play" onclick="toggleTimer()">▶</button>
        <button class="btn" onclick="skipSession()">SKIP</button>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><span class="stat-val" id="today-sessions">0</span><span class="stat-lbl">Sessions</span></div>
      <div class="stat-card"><span class="stat-val" id="today-chars">0</span><span class="stat-lbl">Today's Chars</span></div>
    </div>
    <div id="history-list"></div>
  </div>

  <div id="view-settings" class="view">
    <div class="settings-view">
      <h2>Timer Configuration</h2>
      <div class="setting-row">
        <div class="setting-info"><span>Focus Time</span><small>Minutes for writing</small></div>
        <input type="number" class="input-num" id="set-focus" onchange="updateSettings()">
      </div>
      <div class="setting-row">
        <div class="setting-info"><span>Break Time</span><small>Minutes for rest</small></div>
        <input type="number" class="input-num" id="set-break" onchange="updateSettings()">
      </div>
      <div style="margin-top: 40px; text-align: center;">
        <button onclick="localStorage.clear(); location.reload();" style="color:var(--text-sub); background:none; border:none; font-size:0.6rem; text-decoration:underline;">RESET ALL DATA</button>
      </div>
    </div>
  </div>
</div>

<nav>
  <button id="nav-timer" class="active" onclick="switchView('timer')">Timer</button>
  <button id="nav-settings" onclick="switchView('settings')">Settings</button>
</nav>

<script>
// Load Data
let data = JSON.parse(localStorage.getItem('pomowriters_v4') || '{"settings":{"focus":20,"break":5},"days":{}}');
let state = { running: false, mode: 'focus', timeLeft: data.settings.focus * 60, timerId: null, audioCtx: null };

function todayKey() { return new Date().toISOString().split('T')[0]; }

function initAudio() {
  if (!state.audioCtx) {
    state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function updateUI() {
  const m = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
  const s = (state.timeLeft % 60).toString().padStart(2, '0');
  document.getElementById('timer-display').textContent = `${m}:${s}`;
  
  const tk = todayKey();
  const day = data.days[tk] || { sessions: 0, chars: 0, history: [] };
  document.getElementById('today-sessions').textContent = day.sessions;
  document.getElementById('today-chars').textContent = day.chars;
  
  let total = 0;
  Object.values(data.days).forEach(d => total += (d.chars || 0));
  document.getElementById('total-chars').textContent = total.toLocaleString();
}

function switchView(viewName) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  
  document.getElementById('view-' + viewName).classList.add('active');
  document.getElementById('nav-' + viewName).classList.add('active');
  
  // Settings view に入った時に現在の値を表示
  if (viewName === 'settings') {
    document.getElementById('set-focus').value = data.settings.focus;
    document.getElementById('set-break').value = data.settings.break;
  }
}

function updateSettings() {
  data.settings.focus = parseInt(document.getElementById('set-focus').value) || 1;
  data.settings.break = parseInt(document.getElementById('set-break').value) || 1;
  localStorage.setItem('pomowriters_v4', JSON.stringify(data));
  if (!state.running) resetTimer();
}

async function toggleTimer() {
  initAudio();
  if (state.running) {
    state.running = false;
    clearInterval(state.timerId);
    document.getElementById('btn-play').textContent = "▶";
  } else {
    state.running = true;
    state.endTime = Date.now() + (state.timeLeft * 1000);
    state.timerId = setInterval(tick, 200);
    document.getElementById('btn-play').textContent = "⏸";
  }
}

function tick() {
  const now = Date.now();
  const diff = Math.round((state.endTime - now) / 1000);
  if (diff <= 0) {
    state.timeLeft = 0;
    complete();
  } else {
    state.timeLeft = diff;
    updateUI();
  }
}

function playAlarm() {
  if (!state.audioCtx) return;
  const osc = state.audioCtx.createOscillator();
  const gain = state.audioCtx.createGain();
  osc.connect(gain); gain.connect(state.audioCtx.destination);
  osc.frequency.setValueAtTime(880, state.audioCtx.currentTime);
  gain.gain.setValueAtTime(0.1, state.audioCtx.currentTime);
  osc.start(); osc.stop(state.audioCtx.currentTime + 1);
}

function complete() {
  state.running = false;
  clearInterval(state.timerId);
  playAlarm();
  document.getElementById('timer-card').classList.add('flash-red');

  setTimeout(() => {
    let charDiff = 0;
    if (state.mode === 'focus') {
      const s = prompt("Start Chars:", "0");
      const e = prompt("End Chars:", s);
      charDiff = (parseInt(e) || 0) - (parseInt(s) || 0);
    } else {
      alert("Break finished.");
    }

    const tk = todayKey();
    if (!data.days[tk]) data.days[tk] = { sessions: 0, chars: 0, history: [] };
    if (state.mode === 'focus') {
      data.days[tk].sessions++;
      data.days[tk].chars += charDiff;
    }
    localStorage.setItem('pomowriters_v4', JSON.stringify(data));
    document.getElementById('timer-card').classList.remove('flash-red');
    
    state.mode = (state.mode === 'focus') ? 'break' : 'focus';
    state.timeLeft = (state.mode === 'focus' ? data.settings.focus : data.settings.break) * 60;
    document.getElementById('mode-text').textContent = state.mode.toUpperCase();
    document.getElementById('btn-play').textContent = "▶";
    updateUI();
  }, 300);
}

function resetTimer() {
  state.running = false;
  clearInterval(state.timerId);
  state.timeLeft = (state.mode === 'focus' ? data.settings.focus : data.settings.break) * 60;
  document.getElementById('btn-play').textContent = "▶";
  updateUI();
}

function skipSession() { if(confirm("Skip?")) complete(); }

// Init
updateUI();
</script>
</body>
</html>
