<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pomodoro-for-writers Pro</title>
<style>
/* 既存のスタイルを継承しつつ、通知用の点滅アニメーションを追加 */
:root {
  --bg: #0f1117; --surface: #181c27; --border: #2a3050;
  --text: #e8eaf0; --muted: #5a6080; --focus-color: #e05a5a;
  --break-color: #4ab89a; --accent: #f0a04a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }
#app { display: flex; flex-direction: column; height: 100%; }
header { padding: 20px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
#content { flex: 1; overflow-y: auto; padding-bottom: 80px; }
.timer-section { padding: 40px 20px; text-align: center; }
.timer-display { font-size: 4rem; font-family: monospace; margin: 20px 0; color: var(--focus-color); }
.controls { display: flex; justify-content: center; gap: 20px; }
.btn { padding: 15px 30px; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; }
.btn-main { background: var(--focus-color); color: white; font-size: 1.2rem; }
.btn-sub { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.stats-section, .history-section { margin: 15px; padding: 15px; background: var(--surface); border-radius: 8px; }
.stat-num { font-size: 1.5rem; color: var(--accent); font-family: monospace; }
.history-item { border-bottom: 1px solid var(--border); padding: 8px 0; font-size: 0.8rem; }
nav { position: fixed; bottom: 0; width: 100%; display: flex; background: var(--surface); border-top: 1px solid var(--border); }
nav button { flex: 1; padding: 15px; background: none; border: none; color: var(--muted); }
nav button.active { color: var(--focus-color); }

/* 完了時の画面点滅効果 */
@keyframes blink { 0% { background: var(--bg); } 50% { background: var(--focus-color); } 100% { background: var(--bg); } }
.finish-alert { animation: blink 0.5s linear infinite; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1 id="main-title">論文ポモドーロ</h1>
      <div id="wakelock-status" style="font-size: 0.6rem; color: var(--break-color);"></div>
    </div>
    <div style="text-align: right;">
      <div class="stat-num" id="h-total-chars">0</div>
      <div style="font-size: 0.6rem; color: var(--muted);">累計文字数</div>
    </div>
  </header>

  <div id="content">
    <div id="page-timer">
      <div class="timer-section">
        <div id="timer-mode" style="margin-bottom: 10px; font-weight: bold;">集中モード</div>
        <div class="timer-display" id="timer-display">20:00</div>
        <div class="controls">
          <button class="btn btn-sub" onclick="resetTimer()">↺</button>
          <button class="btn btn-main" id="btn-play" onclick="toggleTimer()">▶ スタート</button>
          <button class="btn btn-sub" onclick="skipSession()">⏭</button>
        </div>
      </div>

      <div class="stats-section">
        <div style="display: flex; justify-content: space-around; text-align: center;">
          <div><div class="stat-num" id="stat-sessions">0</div><div>セッション</div></div>
          <div><div class="stat-num" id="stat-chars">0</div><div>今日の文字数</div></div>
        </div>
      </div>

      <div class="history-section">
        <div style="font-size: 0.7rem; color: var(--muted); margin-bottom: 10px;">本日の履歴</div>
        <div id="history-list"></div>
      </div>
    </div>
  </div>

  <nav>
    <button class="active">⏱ タイマー</button>
    <button onclick="alert('設定機能は次回実装します。現在の20分設定で動作中。')">⚙ 設定</button>
  </nav>
</div>

<script>
// 設定（酒井先生用に20分をデフォルトに固定）
let config = { focus: 20, shortBreak: 5 };
let data = JSON.parse(localStorage.getItem('pomowrite_v2') || '{"days":{}}');
let wakeLock = null;

let state = {
  running: false,
  mode: 'focus',
  endTime: null, // 終了予定時刻
  timeLeft: config.focus * 60,
  timerId: null
};

function todayKey() { return new Date().toISOString().split('T')[0]; }

function updateUI() {
  const m = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
  const s = (state.timeLeft % 60).toString().padStart(2, '0');
  document.getElementById('timer-display').textContent = `${m}:${s}`;
  
  const tk = todayKey();
  const day = data.days[tk] || { sessions: 0, chars: 0, history: [] };
  document.getElementById('stat-sessions').textContent = day.sessions;
  document.getElementById('stat-chars').textContent = day.chars;
  
  // 累計
  let total = 0;
  Object.values(data.days).forEach(d => total += (d.chars || 0));
  document.getElementById('h-total-chars').textContent = total.toLocaleString();

  // 履歴表示
  document.getElementById('history-list').innerHTML = (day.history || []).slice().reverse().map(h => `
    <div class="history-item"><b>${h.time}</b>: ${h.mode === 'focus' ? '🎯' : '☕'} ${h.note}</div>
  `).join('');
}

async function toggleTimer() {
  if (state.running) {
    state.running = false;
    clearInterval(state.timerId);
    document.getElementById('btn-play').textContent = "▶ スタート";
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
  } else {
    state.running = true;
    // 終了時刻を確定させる（これによってアプリを閉じても計算可能になる）
    state.endTime = Date.now() + (state.timeLeft * 1000);
    state.timerId = setInterval(tick, 200);
    document.getElementById('btn-play').textContent = "⏸ 一時停止";
    
    // スリープ防止
    if ('wakeLock' in navigator) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
    // 音を出す準備（ブラウザ制限解除のため空の音を鳴らす）
    playBeep(0);
  }
}

function tick() {
  const now = Date.now();
  const diff = Math.round((state.endTime - now) / 1000);

  if (diff <= 0) {
    state.timeLeft = 0;
    completeSession();
  } else {
    state.timeLeft = diff;
    if (diff % 5 === 0) updateUI(); // 5秒ごとにUI更新
    else document.getElementById('timer-display').textContent = formatTime(diff);
  }
}

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function completeSession() {
  state.running = false;
  clearInterval(state.timerId);
  updateUI();
  
  // 1. 強烈な合図（音と画面点滅）
  playBeep();
  document.body.classList.add('finish-alert');
  
  // 2. データの記録
  setTimeout(() => {
    let note = "";
    let chars = 0;
    if (state.mode === 'focus') {
      const res = prompt("20分完了しました！お疲れ様です。\n執筆した文字数、または進捗メモを入力してください。", "0");
      note = res || "完了";
      chars = parseInt(res.match(/\d+/) || 0);
    } else {
      alert("休憩が終わりました。次のセッションを始めましょう！");
      note = "休憩完了";
    }

    const tk = todayKey();
    if (!data.days[tk]) data.days[tk] = { sessions: 0, chars: 0, history: [] };
    
    if (state.mode === 'focus') {
      data.days[tk].sessions += 1;
      data.days[tk].chars += chars;
    }
    
    const now = new Date();
    data.days[tk].history.push({
      time: now.getHours() + ":" + now.getMinutes().toString().padStart(2,'0'),
      mode: state.mode,
      note: note
    });
    
    localStorage.setItem('pomowrite_v2', JSON.stringify(data));
    document.body.classList.remove('finish-alert');

    // モード切替
    state.mode = (state.mode === 'focus') ? 'break' : 'focus';
    state.timeLeft = (state.mode === 'focus' ? config.focus : config.shortBreak) * 60;
    document.getElementById('timer-mode').textContent = state.mode === 'focus' ? "集中モード" : "休憩タイム";
    document.getElementById('btn-play').textContent = "▶ スタート";
    updateUI();
  }, 100);
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 1); // 1秒間鳴らす
  } catch(e) {}
}

function resetTimer() {
  clearInterval(state.timerId);
  state.running = false;
  state.timeLeft = config.focus * 60;
  updateUI();
}

function skipSession() {
  if (confirm("このセッションを終了（スキップ）しますか？")) {
    state.endTime = Date.now();
    tick();
  }
}

// 初期表示
updateUI();
</script>
</body>
</html>
