<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro-for-writers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root { --bg: #0b0e14; --surface: #161b22; --accent: #e05a5a; --text-main: #f0f6fc; --text-sub: #8b949e; --border: #30363d; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); height: 100vh; overflow: hidden; }
header { padding: 24px 20px 10px; display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--border); }
h1 { font-size: 1.1rem; font-weight: 300; letter-spacing: 0.1em; }
.header-right { text-align: right; }
.project-badge { font-size: 0.6rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2px; }
.project-name { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: var(--accent); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
.total-label { font-size: 0.6rem; color: var(--text-sub); text-transform: uppercase; margin-top: 4px; }
.total-count { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; color: var(--accent); }
#content { height: calc(100% - 160px); overflow-y: auto; padding: 30px 20px; }
.view { display: none; }
.view.active { display: block; }

/* Timer */
.timer-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 40px 20px 30px; text-align: center; max-width: 500px; margin: 0 auto 20px; }
.mode-status { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.3em; color: var(--text-sub); margin-bottom: 10px; }
.timer-display { font-family: 'JetBrains Mono', monospace; font-size: 5rem; font-weight: 500; margin-bottom: 16px; }
.activity-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 28px; }
.act-chip { background: transparent; border: 1px solid var(--border); color: var(--text-sub); border-radius: 20px; padding: 5px 14px; font-size: 0.78rem; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.act-chip.selected { border-color: var(--accent); color: var(--accent); background: rgba(224,90,90,0.08); }
.controls { display: flex; justify-content: center; align-items: center; gap: 30px; }
.btn { background: none; border: none; color: var(--text-sub); font-size: 0.8rem; cursor: pointer; padding: 10px; text-transform: uppercase; }
.btn-play { background: var(--accent); color: white; width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; box-shadow: 0 4px 20px rgba(224,90,90,0.4); border: none; cursor: pointer; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 500px; margin: 0 auto; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; text-align: center; }
.stat-val { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; display: block; }
.stat-lbl { font-size: 0.7rem; color: var(--text-sub); margin-top: 6px; }

/* Projects */
.section-header { font-size: 0.72rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.1em; padding: 0 0 10px 0; }
.project-list { max-width: 500px; margin: 0 auto 20px; }
.project-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; }
.project-item.active-project { border-color: var(--accent); }
.project-item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.project-item-name { font-size: 0.95rem; font-weight: 600; }
.project-item-name.is-active { color: var(--accent); }
.project-item-meta { font-size: 0.72rem; color: var(--text-sub); margin-top: 2px; }
.project-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
.proj-btn { background: transparent; border: 1px solid var(--border); color: var(--text-sub); padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 0.72rem; white-space: nowrap; }
.proj-btn-switch { border-color: var(--accent); color: var(--accent); }
.activity-breakdown { display: flex; flex-wrap: wrap; gap: 6px; }
.act-tag { font-size: 0.72rem; font-family: 'JetBrains Mono', monospace; background: #1e242d; border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; color: var(--text-sub); }
.act-tag span { color: var(--text-main); }
.new-project-btn { display: block; width: 100%; max-width: 500px; margin: 0 auto 30px; padding: 14px; background: transparent; border: 1px dashed var(--border); color: var(--text-sub); border-radius: 12px; cursor: pointer; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; }

/* Settings */
.settings-panel { max-width:500px; margin:0 auto; background:var(--surface); border-radius:15px; border:1px solid var(--border); overflow:hidden; margin-bottom:20px; }
.settings-row { display:flex; justify-content:space-between; align-items:center; padding:22px 25px; border-bottom:1px solid var(--border); }
.settings-row:last-child { border-bottom: none; }
.settings-input { background:#000; border:1px solid var(--border); color:var(--accent); width:80px; text-align:center; padding:5px; border-radius:5px; font-family:'JetBrains Mono',monospace; font-size:0.95rem; }
.category-mgmt { max-width:500px; margin:0 auto; background:var(--surface); border-radius:15px; border:1px solid var(--border); overflow:hidden; margin-bottom:20px; }
.cat-header { padding:14px 25px; font-size:0.72rem; color:var(--text-sub); text-transform:uppercase; letter-spacing:0.1em; border-bottom:1px solid var(--border); }
.cat-row { display:flex; justify-content:space-between; align-items:center; padding:14px 25px; border-bottom:1px solid var(--border); }
.cat-row:last-child { border-bottom:none; }
.cat-name { font-size:0.88rem; }
.cat-del { background:transparent; border:1px solid #6b2020; color:var(--accent); padding:4px 10px; border-radius:5px; cursor:pointer; font-size:0.72rem; }
.cat-add-row { padding:14px 25px; display:flex; gap:8px; }
.cat-add-input { flex:1; background:#000; border:1px solid var(--border); color:var(--text-main); padding:7px 10px; border-radius:6px; font-size:0.85rem; outline:none; }
.cat-add-input:focus { border-color:var(--accent); }
.cat-add-btn { background:var(--accent); color:white; border:none; border-radius:6px; padding:7px 16px; cursor:pointer; font-size:0.82rem; }

/* Review */
.review-range-btns { display:flex; gap:8px; max-width:500px; margin:0 auto 16px; }
.review-range-btn { flex:1; padding:9px; background:transparent; border:1px solid var(--border); color:var(--text-sub); border-radius:8px; cursor:pointer; font-size:0.8rem; }
.review-range-btn.active { background:var(--accent); border-color:var(--accent); color:white; font-weight:600; }
.review-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; max-width:500px; margin:0 auto 14px; }
.review-card-title { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-sub); margin-bottom:14px; }
.review-summary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:4px; }
.review-summary-item { text-align:center; }
.review-summary-val { font-family:'JetBrains Mono',monospace; font-size:1.3rem; color:var(--accent); display:block; }
.review-summary-lbl { font-size:0.65rem; color:var(--text-sub); margin-top:3px; }
.chart-wrap { position:relative; }

/* Edit records modal */
.edit-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200; align-items:flex-start; justify-content:center; overflow-y:auto; padding:20px 0 90px; }
.edit-modal-overlay.active { display:flex; }
.edit-modal-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px 20px; width:90%; max-width:480px; margin:auto; }
.edit-modal-title { font-size:1rem; font-weight:600; margin-bottom:4px; }
.edit-modal-sub { font-size:0.75rem; color:var(--text-sub); margin-bottom:16px; }
.edit-day-row { display:grid; grid-template-columns:90px 1fr; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); }
.edit-day-row:last-child { border-bottom:none; }
.edit-day-label { font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--text-sub); }
.edit-cat-row { display:flex; gap:6px; flex-wrap:wrap; }
.edit-cat-input-wrap { display:flex; align-items:center; gap:4px; }
.edit-cat-label { font-size:0.7rem; color:var(--text-sub); white-space:nowrap; }
.edit-cat-input { width:48px; background:#000; border:1px solid var(--border); color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:0.9rem; text-align:center; padding:4px 6px; border-radius:6px; outline:none; }
.edit-cat-input:focus { border-color:var(--accent); }
.edit-modal-btns { display:flex; gap:10px; margin-top:18px; }
.edit-modal-save { flex:1; background:var(--accent); color:white; border:none; border-radius:10px; padding:12px; cursor:pointer; font-size:0.9rem; font-family:'Inter',sans-serif; }
.edit-modal-cancel { flex:1; background:transparent; color:var(--text-sub); border:1px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; font-size:0.9rem; font-family:'Inter',sans-serif; }

/* Nav */
nav { position: fixed; bottom: 0; width: 100%; height: 72px; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: center; gap: 20px; }
nav button { background: none; border: none; color: var(--text-sub); font-size: 0.72rem; text-transform: uppercase; cursor: pointer; width: 80px; }
nav button.active { color: var(--accent); font-weight: 600; border-top: 2px solid var(--accent); }
.flash-red { animation: flash 0.5s infinite; }
@keyframes flash { 0%{background:var(--surface);}50%{background:#4a1515;}100%{background:var(--surface);} }

/* Sync */
.sync-bar { max-width:500px; margin:0 auto 16px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.sync-status { font-size:0.75rem; color:var(--text-sub); }
.sync-status.ok { color:#52b788; }
.sync-status.err { color:#e05a5a; }
.sync-btn { background:var(--accent); color:white; border:none; border-radius:8px; padding:7px 14px; font-size:0.75rem; cursor:pointer; white-space:nowrap; }
.sync-btn.secondary { background:transparent; border:1px solid var(--border); color:var(--text-sub); }

/* Modal */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:100; align-items:center; justify-content:center; pointer-events:none; }
.modal-overlay.active { display:flex; pointer-events:auto; }
.modal-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px 24px; width:90%; max-width:380px; text-align:center; }
.modal-title { font-size:1rem; font-weight:600; margin-bottom:8px; }
.modal-sub { font-size:0.78rem; color:var(--text-sub); margin-bottom:16px; line-height:1.7; white-space:pre-line; }
.modal-input { width:100%; background:#000; border:1px solid var(--border); color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:1.5rem; text-align:center; padding:10px; border-radius:8px; margin-bottom:16px; outline:none; }
.modal-input.text-input { font-size:1rem; font-family:'Inter',sans-serif; }
.modal-input:focus { border-color:var(--accent); }
.modal-buttons { display:flex; gap:12px; justify-content:center; }
.modal-btn { padding:10px 24px; border-radius:8px; border:none; cursor:pointer; font-size:0.85rem; font-family:'Inter',sans-serif; }
.modal-btn-ok { background:var(--accent); color:white; }
.modal-btn-cancel { background:transparent; color:var(--text-sub); border:1px solid var(--border); }
</style>
</head>
<body>

<header>
  <h1>Pomodoro-for-writers</h1>
  <div class="header-right">
    <div class="project-badge">Current Project</div>
    <div class="project-name" id="header-project-name">—</div>
    <div class="total-label">Project Total</div>
    <div class="total-count" id="total-chars">0</div>
  </div>
</header>

<div id="content">

  <!-- Timer -->
  <div id="view-timer" class="view active">
    <div class="timer-card" id="timer-card">
      <div class="mode-status" id="mode-text">Focus</div>
      <div class="timer-display" id="timer-display">20:00</div>
      <div class="activity-row" id="activity-row"></div>
      <div class="controls">
        <button class="btn" onclick="resetTimer()">Reset</button>
        <button class="btn-play" id="btn-play" onclick="handlePlay()">&#9654;</button>
        <button class="btn" onclick="skipSession()">Skip</button>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><span class="stat-val" id="today-sessions">0</span><span class="stat-lbl">Sessions Today</span></div>
      <div class="stat-card"><span class="stat-val" id="today-chars">0</span><span class="stat-lbl">Today's Chars</span></div>
      <div class="stat-card" style="grid-column:1/-1;"><span class="stat-val" id="project-total-sessions">0</span><span class="stat-lbl">Project Total Sessions</span></div>
    </div>
  </div>

  <!-- Projects -->
  <div id="view-projects" class="view">
    <div class="project-list">
      <div class="section-header">プロジェクト一覧</div>
      <div id="projects-list"></div>
    </div>
    <button class="new-project-btn" onclick="createNewProject()">＋ 新しいプロジェクトを開始</button>
  </div>

  <!-- Settings -->
  <div id="view-settings" class="view">

    <!-- Google Drive同期 -->
    <div class="sync-bar" id="sync-bar">
      <div>
        <div style="font-size:0.78rem;font-weight:600;margin-bottom:2px;">Google Drive 同期</div>
        <div class="sync-status" id="sync-status">未ログイン</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="sync-btn secondary" id="sync-logout-btn" onclick="gSignOut()" style="display:none;">ログアウト</button>
        <button class="sync-btn" id="sync-action-btn" onclick="gSignIn()">ログイン</button>
      </div>
    </div>
    <div class="settings-panel">
      <div class="settings-row">
        <span>Focus (min)</span>
        <input type="number" id="set-focus" class="settings-input" oninput="saveSettings()">
      </div>
      <div class="settings-row">
        <span>Break (min)</span>
        <input type="number" id="set-break" class="settings-input" oninput="saveSettings()">
      </div>
    </div>
    <div class="category-mgmt">
      <div class="cat-header">作業カテゴリの管理</div>
      <div id="cat-list"></div>
      <div class="cat-add-row">
        <input type="text" id="cat-add-input" class="cat-add-input" placeholder="新しいカテゴリ名" maxlength="20">
        <button class="cat-add-btn" onclick="addCategory()">追加</button>
      </div>
    </div>
    <div style="max-width:500px;margin:0 auto;text-align:center;padding-bottom:20px;">
      <button onclick="clearAllData()" style="background:transparent;border:1px solid #6b2020;color:#e05a5a;padding:12px 30px;border-radius:8px;cursor:pointer;font-size:0.8rem;text-transform:uppercase;">すべてのデータを削除</button>
    </div>
  </div>

  <!-- Review -->
  <div id="view-review" class="view">

    <!-- 月選択 -->
    <div style="display:flex;align-items:center;justify-content:space-between;max-width:500px;margin:0 auto 16px;">
      <button class="review-range-btn" id="rv-prev-month" style="flex:0 0 auto;width:40px;">‹</button>
      <div style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:0.95rem;" id="rv-month-label">—</div>
      <button class="review-range-btn" id="rv-next-month" style="flex:0 0 auto;width:40px;">›</button>
    </div>

    <!-- サマリー -->
    <div class="review-card">
      <div class="review-card-title">サマリー</div>
      <div class="review-summary-grid">
        <div class="review-summary-item"><span class="review-summary-val" id="rv-total">0</span><span class="review-summary-lbl">総セッション</span></div>
        <div class="review-summary-item"><span class="review-summary-val" id="rv-writing">0</span><span class="review-summary-lbl">執筆セッション</span></div>
        <div class="review-summary-item"><span class="review-summary-val" id="rv-chars">0</span><span class="review-summary-lbl">執筆文字数</span></div>
      </div>
    </div>

    <!-- 円グラフ：プロジェクト別割合 -->
    <div class="review-card">
      <div class="review-card-title">プロジェクト別セッション割合</div>
      <div class="chart-wrap" style="max-width:280px;margin:0 auto;"><canvas id="pieChart" height="240"></canvas></div>
    </div>

    <!-- 円グラフ：カテゴリ別割合 -->
    <div class="review-card">
      <div class="review-card-title">カテゴリ別セッション割合</div>
      <div class="chart-wrap" style="max-width:280px;margin:0 auto;"><canvas id="catPieChart" height="240"></canvas></div>
    </div>

    <!-- CSVダウンロード -->
    <div style="max-width:500px;margin:0 auto 30px;text-align:center;">
      <button onclick="downloadCSV()" style="background:var(--accent);color:white;border:none;border-radius:10px;padding:12px 30px;cursor:pointer;font-size:0.85rem;width:100%;">📥 全データをCSVでダウンロード</button>
    </div>
  </div>

</div>

<nav>
  <button id="nav-timer" class="active" onclick="switchView('timer')">Timer</button>
  <button id="nav-projects" onclick="switchView('projects')">Projects</button>
  <button id="nav-review" onclick="switchView('review')">振り返り</button>
  <button id="nav-settings" onclick="switchView('settings')">Settings</button>
</nav>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-sub" id="modal-sub"></div>
    <input class="modal-input" id="modal-input" placeholder="">
    <div class="modal-buttons">
      <button class="modal-btn modal-btn-cancel" id="modal-cancel-btn">キャンセル</button>
      <button class="modal-btn modal-btn-ok" id="modal-ok-btn">OK</button>
    </div>
  </div>
</div>

<!-- 記録編集モーダル -->
<div class="edit-modal-overlay" id="edit-modal-overlay">
  <div class="edit-modal-box">
    <div class="edit-modal-title" id="edit-modal-title">記録を編集</div>
    <div class="edit-modal-sub">各日付のカテゴリ別セッション数を編集できます</div>
    <div id="edit-day-list"></div>
    <div class="edit-modal-btns">
      <button class="edit-modal-cancel" onclick="closeEditModal()">キャンセル</button>
      <button class="edit-modal-save" onclick="saveEditModal()">保存する</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
var STORE_KEY = 'pomowriters_v13';
var DEFAULT_CATEGORIES = ['執筆', '読書', '調査', 'その他'];
var WRITING_CATEGORY = '執筆';

function defaultData() {
  var id = genId();
  return {
    settings: { focus: 20, break: 5 },
    categories: DEFAULT_CATEGORIES.slice(),
    activeProjectId: id,
    projects: { [id]: { id: id, name: 'Project 1', createdAt: todayKey(), days: {} } }
  };
}

function loadData() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) { var d = JSON.parse(raw); if (!d.categories) d.categories = DEFAULT_CATEGORIES.slice(); return d; }
    var oldRaw = localStorage.getItem('pomowriters_v12');
    if (oldRaw) {
      var old = JSON.parse(oldRaw);
      var d2 = defaultData();
      d2.settings = old.settings || d2.settings;
      var proj = Object.values(d2.projects)[0];
      proj.name = 'Project 1（移行データ）';
      for (var pid in (old.projects || {})) {
        var op = old.projects[pid];
        for (var dayK in (op.days || {})) {
          var od = op.days[dayK];
          proj.days[dayK] = { sessions: od.sessions||0, chars: od.chars||0,
            byCategory: { '執筆': { sessions: od.sessions||0, chars: od.chars||0 } } };
        }
      }
      return d2;
    }
  } catch(e) {}
  return defaultData();
}

var data = loadData();
var state = {
  running: false, mode: 'focus',
  timeLeft: data.settings.focus * 60,
  timerId: null, endTime: 0, startCount: 0,
  currentCategory: data.categories[0] || WRITING_CATEGORY,
  audioCtx: null
};

function save() { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function todayKey() { return new Date().toISOString().split('T')[0]; }
function activeProject() { return data.projects[data.activeProjectId]; }
function isWriting() { return state.currentCategory === WRITING_CATEGORY; }

// ── Activity chips ──────────────────────────────────────
function renderActivityChips() {
  var row = document.getElementById('activity-row');
  row.innerHTML = '';
  data.categories.forEach(function(cat) {
    var btn = document.createElement('button');
    btn.className = 'act-chip' + (cat === state.currentCategory ? ' selected' : '');
    btn.textContent = cat;
    btn.onclick = function() { state.currentCategory = cat; renderActivityChips(); };
    row.appendChild(btn);
  });
}

// ── UI ──────────────────────────────────────────────────
function updateUI() {
  var m = Math.floor(state.timeLeft/60).toString().padStart(2,'0');
  var s = (state.timeLeft%60).toString().padStart(2,'0');
  document.getElementById('timer-display').textContent = m+':'+s;
  document.getElementById('mode-text').textContent = state.mode==='focus' ? 'Focus' : 'Break';
  var proj = activeProject();
  document.getElementById('header-project-name').textContent = proj ? proj.name : '—';
  var tk = todayKey();
  var day = proj && proj.days[tk] ? proj.days[tk] : { sessions:0, chars:0 };
  document.getElementById('today-sessions').textContent = day.sessions||0;
  document.getElementById('today-chars').textContent = (day.chars||0).toLocaleString();
  document.getElementById('total-chars').textContent = (proj ? projectTotalChars(proj) : 0).toLocaleString();
  // プロジェクト合計セッション数
  var totalSessions = 0;
  if (proj) { for(var dk in proj.days) totalSessions += (proj.days[dk].sessions||0); }
  document.getElementById('project-total-sessions').textContent = totalSessions;
}

// ── Modal ───────────────────────────────────────────────
function showModal(title, sub, defaultVal, isText, onOk, onCancel) {
  var overlay = document.getElementById('modal-overlay');
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-sub').textContent = sub;
  var input = document.getElementById('modal-input');
  input.value = (defaultVal!==null && defaultVal!==undefined && defaultVal!=='') ? defaultVal : '';
  input.type = isText ? 'text' : 'number';
  input.inputMode = isText ? 'text' : 'numeric';
  input.className = 'modal-input'+(isText?' text-input':'');
  overlay.classList.add('active');
  setTimeout(function(){ input.focus(); }, 100);
  var okBtn = document.getElementById('modal-ok-btn');
  var cancelBtn = document.getElementById('modal-cancel-btn');
  function cleanup() {
    overlay.classList.remove('active');
    okBtn.removeEventListener('click', handleOk);
    cancelBtn.removeEventListener('click', handleCancel);
    input.removeEventListener('keydown', handleKey);
  }
  function handleOk() { cleanup(); onOk(input.value); }
  function handleCancel() { cleanup(); if(onCancel) onCancel(); }
  function handleKey(e) { if(e.key==='Enter'&&!e.isComposing) handleOk(); if(e.key==='Escape') handleCancel(); }
  okBtn.addEventListener('click', handleOk);
  cancelBtn.addEventListener('click', handleCancel);
  input.addEventListener('keydown', handleKey);
}

// ── Timer ───────────────────────────────────────────────
function handlePlay() {
  if (!state.audioCtx) state.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if (state.running) { toggleTimer(); return; }
  if (state.mode==='focus' && isWriting()) {
    showModal('執筆開始', '現在の文字数を入力してください\n（空欄なら前回値を引き継ぎ）', state.startCount||'', false,
      function(val){ state.startCount=(val==='')?state.startCount:(parseInt(val)||0); toggleTimer(); }, null);
  } else { toggleTimer(); }
}

function toggleTimer() {
  if (state.running) {
    state.running=false; clearInterval(state.timerId);
    document.getElementById('btn-play').innerHTML='&#9654;';
  } else {
    state.running=true; state.endTime=Date.now()+state.timeLeft*1000;
    state.timerId=setInterval(tick,200);
    document.getElementById('btn-play').innerHTML='&#9208;';
  }
}

function tick() {
  var diff=Math.round((state.endTime-Date.now())/1000);
  if(diff<=0){ state.timeLeft=0; updateUI(); complete(); }
  else { state.timeLeft=diff; updateUI(); }
}

function playSound() {
  if(!state.audioCtx) return;
  var osc=state.audioCtx.createOscillator(), gain=state.audioCtx.createGain();
  osc.connect(gain); gain.connect(state.audioCtx.destination);
  osc.frequency.setValueAtTime(880,state.audioCtx.currentTime);
  gain.gain.setValueAtTime(0,state.audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.2,state.audioCtx.currentTime+0.1);
  gain.gain.exponentialRampToValueAtTime(0.001,state.audioCtx.currentTime+1);
  osc.start(); osc.stop(state.audioCtx.currentTime+1);
}

function complete() {
  state.running=false; clearInterval(state.timerId); playSound();
  document.getElementById('timer-card').classList.add('flash-red');
  setTimeout(function(){
    if(state.mode==='focus') {
      if(isWriting()) {
        showModal('セッション終了（執筆）','現在の文字数を入力してください\n（空欄なら変化なしで記録）','',false,
          function(val){
            var endCount=(val==='')?state.startCount:(parseInt(val)||state.startCount);
            var diff=Math.max(0,endCount-state.startCount);
            state.startCount=endCount;
            recordSession(state.currentCategory,diff);
            finishComplete();
          }, function(){ finishComplete(); });
      } else {
        recordSession(state.currentCategory,0);
        finishComplete();
      }
    } else { finishComplete(); }
  }, 500);
}

function recordSession(category, chars) {
  var tk=todayKey(), proj=activeProject();
  if(!proj.days[tk]) proj.days[tk]={sessions:0,chars:0,byCategory:{}};
  var day=proj.days[tk];
  day.sessions=(day.sessions||0)+1;
  day.chars=(day.chars||0)+chars;
  if(!day.byCategory) day.byCategory={};
  if(!day.byCategory[category]) day.byCategory[category]={sessions:0,chars:0};
  day.byCategory[category].sessions+=1;
  day.byCategory[category].chars+=chars;
  save();
}

function finishComplete() {
  state.mode=(state.mode==='focus')?'break':'focus';
  state.timeLeft=(state.mode==='focus'?data.settings.focus:data.settings.break)*60;
  document.getElementById('btn-play').innerHTML='&#9654;';
  document.getElementById('timer-card').classList.remove('flash-red');
  updateUI();
}

function resetTimer() {
  document.getElementById('modal-overlay').classList.remove('active');
  state.running=false; clearInterval(state.timerId);
  state.mode='focus'; state.timeLeft=data.settings.focus*60; state.startCount=0;
  document.getElementById('btn-play').innerHTML='&#9654;';
  document.getElementById('timer-card').classList.remove('flash-red');
  updateUI();
}

function skipSession() {
  if(!confirm('このセッションをスキップしますか？（記録されません）')) return;
  state.running=false; clearInterval(state.timerId);
  state.mode=(state.mode==='focus')?'break':'focus';
  state.timeLeft=(state.mode==='focus'?data.settings.focus:data.settings.break)*60;
  document.getElementById('btn-play').innerHTML='&#9654;';
  document.getElementById('timer-card').classList.remove('flash-red');
  updateUI();
}

// ── Project helpers ─────────────────────────────────────
function projectTotalChars(proj) {
  var t=0; for(var dk in proj.days) t+=(proj.days[dk].chars||0); return t;
}
function projectCategoryTotals(proj) {
  var result={};
  for(var dk in proj.days) {
    var bc=proj.days[dk].byCategory||{};
    for(var cat in bc) {
      if(!result[cat]) result[cat]={sessions:0,chars:0};
      result[cat].sessions+=(bc[cat].sessions||0);
      result[cat].chars+=(bc[cat].chars||0);
    }
  }
  return result;
}
function projectLastDate(proj) {
  var keys=Object.keys(proj.days).sort();
  return keys.length?keys[keys.length-1]:proj.createdAt;
}

// ── Projects list ───────────────────────────────────────
function renderProjectsList() {
  var container=document.getElementById('projects-list');
  var ids=Object.keys(data.projects).sort(function(a,b){
    return projectLastDate(data.projects[b]).localeCompare(projectLastDate(data.projects[a]));
  });
  if(!ids.length){ container.innerHTML='<div style="color:var(--text-sub);padding:20px;font-size:0.85rem;">プロジェクトがありません</div>'; return; }
  container.innerHTML='';
  ids.forEach(function(pid){
    var proj=data.projects[pid], isActive=pid===data.activeProjectId;
    var catTotals=projectCategoryTotals(proj);
    var catKeys=Object.keys(catTotals);
    var tagsHtml='';
    if(!catKeys.length) {
      tagsHtml='<span style="font-size:0.72rem;color:var(--text-sub);">記録なし</span>';
    } else {
      catKeys.forEach(function(cat){
        var ct=catTotals[cat];
        var detail=ct.chars>0
          ? escHtml(cat)+': <span>'+ct.sessions+'セッション / '+ct.chars.toLocaleString()+'文字</span>'
          : escHtml(cat)+': <span>'+ct.sessions+'セッション</span>';
        tagsHtml+='<div class="act-tag">'+detail+'</div>';
      });
    }
    var item=document.createElement('div');
    item.className='project-item'+(isActive?' active-project':'');
    var totalSessions=catKeys.reduce(function(s,cat){return s+(catTotals[cat].sessions||0);},0);
    var totalChars=projectTotalChars(proj);
    var summaryHtml=totalSessions>0
      ? '<span style="font-family:\'JetBrains Mono\',monospace;font-size:0.8rem;color:var(--accent);">計 '+totalSessions+' セッション'+(totalChars>0?' / '+totalChars.toLocaleString()+'文字':'')+'</span>'
      : '';
    item.innerHTML=
      '<div class="project-item-top">'+
        '<div class="project-item-left">'+
          '<div class="project-item-name'+(isActive?' is-active':'')+'">'+
            (isActive?'▶ ':'')+escHtml(proj.name)+
          '</div>'+
          '<div class="project-item-meta">開始: '+proj.createdAt+'　最終: '+projectLastDate(proj)+'</div>'+
        '</div>'+
        '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">'+
          summaryHtml+
          '<div class="project-item-actions">'+
            (!isActive?'<button class="proj-btn proj-btn-switch" data-action="switch">切替</button>':'')+
            '<button class="proj-btn" data-action="edit">記録編集</button>'+
            '<button class="proj-btn" data-action="rename">名前変更</button>'+
            (!isActive?'<button class="proj-btn" style="border-color:#6b2020;color:var(--accent);" data-action="delete">削除</button>':'')+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="activity-breakdown">'+tagsHtml+'</div>';

    // イベントをdata属性で安全に登録
    item.querySelectorAll('[data-action]').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var action = btn.getAttribute('data-action');
        if (action === 'switch') switchProject(pid);
        else if (action === 'edit') openEditModal(pid);
        else if (action === 'rename') renameProject(pid);
        else if (action === 'delete') deleteProject(pid);
      });
    });

    container.appendChild(item);
  });
}

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── 記録編集モーダル ────────────────────────────────────
var editingPid = null;
var editInputs = {}; // { "YYYY-MM-DD": { cat: inputEl } }

function openEditModal(pid) {
  var proj = data.projects[pid];
  if (!proj) return;
  editingPid = pid;
  editInputs = {};
  document.getElementById('edit-modal-title').textContent = '「' + proj.name + '」の記録を編集';

  var container = document.getElementById('edit-day-list');
  container.innerHTML = '';

  var days = Object.keys(proj.days).sort().reverse();
  if (!days.length) {
    container.innerHTML = '<div style="color:var(--text-sub);font-size:0.85rem;padding:16px 0;">記録がありません</div>';
  } else {
    days.forEach(function(dk) {
      var day = proj.days[dk];
      var bc = day.byCategory || {};
      var row = document.createElement('div');
      row.className = 'edit-day-row';
      var catWrap = document.createElement('div');
      catWrap.className = 'edit-cat-row';
      editInputs[dk] = {};

      data.categories.forEach(function(cat) {
        var wrap = document.createElement('div');
        wrap.className = 'edit-cat-input-wrap';
        var lbl = document.createElement('span');
        lbl.className = 'edit-cat-label';
        lbl.textContent = cat + ':';
        var inp = document.createElement('input');
        inp.type = 'number';
        inp.className = 'edit-cat-input';
        inp.min = '0';
        inp.value = bc[cat] ? (bc[cat].sessions || 0) : 0;
        wrap.appendChild(lbl);
        wrap.appendChild(inp);
        catWrap.appendChild(wrap);
        editInputs[dk][cat] = inp;
      });

      var dateLabel = document.createElement('div');
      dateLabel.className = 'edit-day-label';
      dateLabel.textContent = dk;
      row.appendChild(dateLabel);
      row.appendChild(catWrap);
      container.appendChild(row);
    });
  }

  document.getElementById('edit-modal-overlay').classList.add('active');
}

function closeEditModal() {
  document.getElementById('edit-modal-overlay').classList.remove('active');
  editingPid = null;
  editInputs = {};
}

function saveEditModal() {
  var proj = data.projects[editingPid];
  if (!proj) return;

  for (var dk in editInputs) {
    if (!proj.days[dk]) proj.days[dk] = { sessions: 0, chars: 0, byCategory: {} };
    var day = proj.days[dk];
    if (!day.byCategory) day.byCategory = {};

    var totalSessions = 0;
    var totalChars = 0;
    data.categories.forEach(function(cat) {
      var inp = editInputs[dk][cat];
      var val = Math.max(0, parseInt(inp.value) || 0);
      if (!day.byCategory[cat]) day.byCategory[cat] = { sessions: 0, chars: 0 };
      day.byCategory[cat].sessions = val;
      // 執筆以外は文字数0のまま
      if (cat !== WRITING_CATEGORY) day.byCategory[cat].chars = 0;
      totalSessions += val;
      totalChars += day.byCategory[cat].chars || 0;
    });
    // top-levelも更新
    day.sessions = totalSessions;
    day.chars = totalChars;

    // 全部0なら記録ごと削除
    if (totalSessions === 0) delete proj.days[dk];
  }

  save();
  updateUI();
  closeEditModal();
  renderProjectsList();
}

// 月ナビ
document.getElementById('rv-prev-month').addEventListener('click', function(){
  reviewMonth--;
  if(reviewMonth < 0){ reviewMonth = 11; reviewYear--; }
  renderReview();
});
document.getElementById('rv-next-month').addEventListener('click', function(){
  var now = new Date();
  if(reviewYear === now.getFullYear() && reviewMonth >= now.getMonth()) return;
  reviewMonth++;
  if(reviewMonth > 11){ reviewMonth = 0; reviewYear++; }
  renderReview();
});

function renderReview() {
  var now = new Date();
  var label = reviewYear + '年' + (reviewMonth+1) + '月';
  document.getElementById('rv-month-label').textContent = label;
  // 翌月ボタンの無効化
  document.getElementById('rv-next-month').style.opacity =
    (reviewYear === now.getFullYear() && reviewMonth >= now.getMonth()) ? '0.3' : '1';

  // 対象月の日付キープレフィックス
  var prefix = reviewYear + '-' + String(reviewMonth+1).padStart(2,'0');

  // プロジェクト別・カテゴリ別集計
  var projTotals = {};   // { pid: { name, sessions, byCategory } }
  var catTotals  = {};   // { cat: sessions }
  var totalSessions = 0, writingSessions = 0, writingChars = 0;

  for (var pid in data.projects) {
    var proj = data.projects[pid];
    var ps = 0, pbc = {};
    for (var dk in proj.days) {
      if (dk.indexOf(prefix) !== 0) continue;
      var day = proj.days[dk];
      ps += day.sessions || 0;
      var bc = day.byCategory || {};
      for (var cat in bc) {
        if (!pbc[cat]) pbc[cat] = { sessions: 0, chars: 0 };
        pbc[cat].sessions += bc[cat].sessions || 0;
        pbc[cat].chars    += bc[cat].chars    || 0;
        if (!catTotals[cat]) catTotals[cat] = 0;
        catTotals[cat] += bc[cat].sessions || 0;
        if (cat === WRITING_CATEGORY) {
          writingSessions += bc[cat].sessions || 0;
          writingChars    += bc[cat].chars    || 0;
        }
      }
    }
    if (ps > 0) projTotals[pid] = { name: proj.name, sessions: ps, byCategory: pbc };
    totalSessions += ps;
  }

  // サマリー
  document.getElementById('rv-total').textContent   = totalSessions;
  document.getElementById('rv-writing').textContent  = writingSessions;
  document.getElementById('rv-chars').textContent    = writingChars.toLocaleString();

  var palette = ['#e05a5a','#52b788','#f2cc8f','#74b3ce','#e07a5f','#9b5de5','#00bbf9','#f15bb5'];

  // ── プロジェクト別円グラフ ──
  var projKeys  = Object.keys(projTotals);
  var projLabels = projKeys.map(function(pid){ return projTotals[pid].name; });
  var projVals   = projKeys.map(function(pid){ return projTotals[pid].sessions; });

  var pieCtx = document.getElementById('pieChart').getContext('2d');
  if (pieChartInstance) pieChartInstance.destroy();
  if (projVals.length === 0) {
    pieCtx.clearRect(0,0,999,999);
    pieCtx.fillStyle='#8b949e'; pieCtx.font='13px sans-serif'; pieCtx.textAlign='center';
    pieCtx.fillText('この月の記録がありません', 140, 120);
  } else {
    pieChartInstance = new Chart(pieCtx, {
      type: 'doughnut',
      data: { labels: projLabels, datasets: [{ data: projVals,
        backgroundColor: projLabels.map(function(_,i){ return palette[i%palette.length]; }),
        borderWidth: 2, borderColor: '#161b22' }] },
      options: { responsive: true, plugins: {
        legend: { position:'bottom', labels:{ color:'#8b949e', font:{size:11}, boxWidth:12, padding:10 } },
        tooltip: { callbacks: { label: function(ctx){
          var total = ctx.dataset.data.reduce(function(a,b){return a+b;},0);
          return ctx.label+': '+ctx.parsed+'セッション ('+Math.round(ctx.parsed/total*100)+'%)';
        }}}
      }}
    });
  }

  // ── カテゴリ別円グラフ ──
  var catKeys   = Object.keys(catTotals).filter(function(c){ return catTotals[c]>0; });
  var catVals   = catKeys.map(function(c){ return catTotals[c]; });

  var catCtx = document.getElementById('catPieChart').getContext('2d');
  if (catPieChartInstance) catPieChartInstance.destroy();
  if (catVals.length === 0) {
    catCtx.clearRect(0,0,999,999);
    catCtx.fillStyle='#8b949e'; catCtx.font='13px sans-serif'; catCtx.textAlign='center';
    catCtx.fillText('この月の記録がありません', 140, 120);
  } else {
    catPieChartInstance = new Chart(catCtx, {
      type: 'doughnut',
      data: { labels: catKeys, datasets: [{ data: catVals,
        backgroundColor: catKeys.map(function(_,i){ return palette[i%palette.length]; }),
        borderWidth: 2, borderColor: '#161b22' }] },
      options: { responsive: true, plugins: {
        legend: { position:'bottom', labels:{ color:'#8b949e', font:{size:11}, boxWidth:12, padding:10 } },
        tooltip: { callbacks: { label: function(ctx){
          var total = ctx.dataset.data.reduce(function(a,b){return a+b;},0);
          return ctx.label+': '+ctx.parsed+'セッション ('+Math.round(ctx.parsed/total*100)+'%)';
        }}}
      }}
    });
  }
}

// ── CSVダウンロード ─────────────────────────────────────
function downloadCSV() {
  // 全カテゴリを収集
  var allCats = data.categories.slice();
  // データに存在するが categories に無いものも追加
  for (var pid in data.projects) {
    for (var dk in data.projects[pid].days) {
      var bc = data.projects[pid].days[dk].byCategory || {};
      for (var cat in bc) { if (allCats.indexOf(cat)===-1) allCats.push(cat); }
    }
  }

  // ヘッダー行（BOMつきでExcelが文字化けしない）
  var BOM = '\uFEFF';
  var header = ['日付','プロジェクト'].concat(allCats.map(function(c){ return c+'(セッション)'; }));
  header.push('執筆文字数');
  var rows = [header];

  // 全日付を収集してソート
  var dateSet = {};
  for (var pid in data.projects) {
    for (var dk in data.projects[pid].days) dateSet[dk] = true;
  }
  var dates = Object.keys(dateSet).sort();

  dates.forEach(function(dk) {
    for (var pid in data.projects) {
      var proj = data.projects[pid];
      if (!proj.days[dk]) continue;
      var day = proj.days[dk];
      var bc = day.byCategory || {};
      var row = [dk, proj.name];
      allCats.forEach(function(cat) {
        row.push(bc[cat] ? (bc[cat].sessions || 0) : 0);
      });
      row.push(bc[WRITING_CATEGORY] ? (bc[WRITING_CATEGORY].chars || 0) : 0);
      rows.push(row);
    }
  });

  var csv = BOM + rows.map(function(r){
    return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(',');
  }).join('\r\n');

  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url;
  a.download = 'pomodoro_' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function saveSettings() {
  var f=parseInt(document.getElementById('set-focus').value)||20;
  var b=parseInt(document.getElementById('set-break').value)||5;
  data.settings.focus=f; data.settings.break=b; save();
  if(!state.running) resetTimer();
}

function clearAllData() {
  if(!confirm('すべてのプロジェクトとデータを削除します。よろしいですか？')) return;
  localStorage.removeItem(STORE_KEY); data=defaultData(); save(); resetTimer(); updateUI();
}

// ── Init ─────────────────────────────────────────────────
renderActivityChips();
updateUI();

// ── Google Drive 同期 ────────────────────────────────────
var CLIENT_ID = '356000893504-uq4o8blrpql70ejkhun0dnrdphinp908.apps.googleusercontent.com';
var SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
var DRIVE_FILENAME = 'pomowriters_data.json';
var gToken = null;
var gFileId = null;
var syncInProgress = false;

function setSyncStatus(msg, cls) {
  var el = document.getElementById('sync-status');
  el.textContent = msg;
  el.className = 'sync-status' + (cls ? ' ' + cls : '');
}

function gSignIn() {
  google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: function(resp) {
      if (resp.error) { setSyncStatus('ログイン失敗', 'err'); return; }
      gToken = resp.access_token;
      document.getElementById('sync-action-btn').textContent = '今すぐ同期';
      document.getElementById('sync-action-btn').onclick = syncNow;
      document.getElementById('sync-logout-btn').style.display = '';
      setSyncStatus('ログイン済み', 'ok');
      syncNow();
    }
  }).requestAccessToken();
}

function gSignOut() {
  google.accounts.oauth2.revoke(gToken, function(){});
  gToken = null; gFileId = null;
  document.getElementById('sync-action-btn').textContent = 'ログイン';
  document.getElementById('sync-action-btn').onclick = gSignIn;
  document.getElementById('sync-logout-btn').style.display = 'none';
  setSyncStatus('未ログイン');
}

async function syncNow() {
  if (!gToken || syncInProgress) return;
  syncInProgress = true;
  setSyncStatus('同期中…');
  try {
    // ファイルIDを検索
    if (!gFileId) {
      var searchRes = await fetch(
        'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27' + DRIVE_FILENAME + '%27&fields=files(id)',
        { headers: { Authorization: 'Bearer ' + gToken } }
      );
      var searchData = await searchRes.json();
      if (searchData.files && searchData.files.length > 0) {
        gFileId = searchData.files[0].id;
      }
    }

    if (gFileId) {
      // リモートデータを取得
      var dlRes = await fetch(
        'https://www.googleapis.com/drive/v3/files/' + gFileId + '?alt=media',
        { headers: { Authorization: 'Bearer ' + gToken } }
      );
      var remoteData = await dlRes.json();

      // タイムスタンプで新しい方を基準にマージ
      var localTs  = data.updatedAt || 0;
      var remoteTs = remoteData.updatedAt || 0;

      if (remoteTs > localTs) {
        // リモートが新しい → リモートを基準にローカルの追加分だけ補完
        data = mergeData(remoteData, data);
      } else {
        // ローカルが新しい → ローカルを基準にリモートの追加分だけ補完
        data = mergeData(data, remoteData);
      }
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
      updateUI();
      renderActivityChips();
    }

    // タイムスタンプを更新してアップロード
    data.updatedAt = Date.now();
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
    await uploadData();
    setSyncStatus('同期完了 ' + new Date().toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit'}), 'ok');
  } catch(e) {
    setSyncStatus('同期失敗: ' + e.message, 'err');
  }
  syncInProgress = false;
}

// base: 新しい方（優先）、sub: 古い方（追加分のみ補完）
function mergeData(base, sub) {
  if (!sub) return base;
  var merged = JSON.parse(JSON.stringify(base));

  // categories: 両方をマージ
  if (sub.categories) {
    sub.categories.forEach(function(cat) {
      if (merged.categories.indexOf(cat) === -1) merged.categories.push(cat);
    });
  }

  // projects: subにしかないプロジェクトを追加、共通プロジェクトは日別データのみ補完
  if (sub.projects) {
    for (var pid in sub.projects) {
      if (!merged.projects[pid]) {
        merged.projects[pid] = sub.projects[pid];
      } else {
        var bp = merged.projects[pid];
        var sp = sub.projects[pid];
        for (var dk in sp.days) {
          if (!bp.days[dk]) {
            // baseにない日付はsubから補完
            bp.days[dk] = sp.days[dk];
          } else {
            // 両方にある場合はセッション数が多い方を採用
            if ((sp.days[dk].sessions || 0) > (bp.days[dk].sessions || 0)) {
              bp.days[dk] = sp.days[dk];
            }
          }
        }
      }
    }
  }

  return merged;
}

async function uploadData() {
  var body = JSON.stringify(data);
  if (gFileId) {
    await fetch('https://www.googleapis.com/upload/drive/v3/files/' + gFileId + '?uploadType=multipart', {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + gToken, 'Content-Type': 'multipart/related; boundary=pomo_boundary' },
      body: '--pomo_boundary\r\nContent-Type: application/json\r\n\r\n' + JSON.stringify({name: DRIVE_FILENAME}) + '\r\n--pomo_boundary\r\nContent-Type: application/json\r\n\r\n' + body + '\r\n--pomo_boundary--'
    });
  } else {
    var res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + gToken, 'Content-Type': 'multipart/related; boundary=pomo_boundary' },
      body: '--pomo_boundary\r\nContent-Type: application/json\r\n\r\n' + JSON.stringify({name: DRIVE_FILENAME, parents: ['appDataFolder']}) + '\r\n--pomo_boundary\r\nContent-Type: application/json\r\n\r\n' + body + '\r\n--pomo_boundary--'
    });
    var resData = await res.json();
    gFileId = resData.id;
  }
}

// セッション記録後・設定変更後に自動同期
var _origSave = save;
save = function() { _origSave(); if (gToken && !syncInProgress) syncNow(); };
</script>
